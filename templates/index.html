{# templates\index.html #}

{% extends '_base.html' %}

{% block main %}

<style>
   
</style>

<section>

    <h2>Todos os Trecos</h2>
    <small>Mais recentes primeiro.</small>

    {% if total > 0 %}
    <div class="grid">
        {% for content in contents %}
        <div class="cell">
            <div class="card">
                <div class="card-image" style="background-image: url('{{ content.photo }}');" title="{{ content.name }}"></div>
                <div class="card-body"><a href="{{ url_for('view', thing_id=content.id) }}">{{ content.name }}</a></div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p>
        Nenhum treco cadastrado ainda!
        <a href="{{ url_for('new_thing') }}">Cadastre um treco</a>
    </p>
    {% endif %}

</section>
{% endblock %}
